location /api {
    proxy_pass        http://127.0.0.1:__PORT_BACKEND__;
    proxy_redirect    off;
    proxy_set_header  Host $host;
    proxy_set_header  X-Real-IP $remote_addr;
    proxy_set_header  X-Forwarded-Proto $scheme;
    proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Host $server_name;

    # Include SSOWAT user panel.
    include conf.d/yunohost_panel.conf.inc;
}

location ~ "^/explorer/items/files/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
    try_files $uri /explorer/items/files/[id].html;
}

location ~ "^/explorer/items/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
    try_files $uri /explorer/items/[id].html;
}

location ~ "^/wopi/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
    try_files $uri /wopi/[id].html;
}    

location ~ "^/explorer/items/(favorites|my-files|recent|shared-with-me)/?$" {
    try_files $uri /explorer/items/$1.html;
}

location ~ "^/sdk/explorer/?$" {
    try_files $uri /sdk/explorer.html;
}

location ~ "^/sdk/?$" {
    try_files $uri /sdk.html;
}

location ~ "^/explorer/trash/?$" {
    try_files $uri /explorer/trash.html;
}

location ~ "^/401/?$" {
    try_files $uri /401.html;
}

location ~ "^/403/?$" {
    try_files $uri /403.html;
}

location = /404.html {
    internal;
}

# Fix .mjs MIME type for Scalingo's Alpine-based nginx
# Alpine's default mime.types lacks .mjs, causing pdf.worker.mjs
# to be served as application/octet-stream which breaks ES modules
location ~* \.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
}

# Frontend export
location / {
    root __INSTALL_DIR__/_build/frontend/out/;
    try_files $uri index.html $uri/ =404;
}